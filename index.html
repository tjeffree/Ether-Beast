<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ether-Beast</title>
  <meta name="description" content="Live status of a passive wardriving Tamagotchi running on an M5Stack CoreInk.">
  <style>
    :root {
      --paper: #f4f1ea;
      --ink: #1d1d1b;
      --muted: #6b675e;
      --card: #fffdf8;
      --line: #d8d3c7;
      --accent: #1d1d1b;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #161614;
        --ink: #ece8de;
        --muted: #9a958a;
        --card: #1f1f1c;
        --line: #34332f;
        --accent: #ece8de;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    main { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-size: 1.1rem; letter-spacing: .2em; text-transform: uppercase; margin: 0 0 4px; }
    .sub { color: var(--muted); margin: 0 0 24px; font-size: .85rem; }
    .card {
      background: var(--card);
      border: 2px solid var(--ink);
      padding: 20px;
    }
    .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
    .level { font-size: 1.4rem; font-weight: 700; }
    .badge {
      border: 2px solid var(--ink); padding: 0 8px; font-size: .75rem;
      text-transform: uppercase; letter-spacing: .1em; white-space: nowrap;
    }
    .badge.hidden { display: none; }
    canvas {
      display: block; margin: 20px auto; width: 100%; max-width: 256px;
      aspect-ratio: 1; image-rendering: pixelated;
    }
    .bar { border: 2px solid var(--ink); height: 18px; padding: 2px; }
    .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .6s; }
    .xp { display: flex; justify-content: space-between; font-size: .85rem; margin-top: 6px; }
    .combo { font-weight: 700; }
    .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
    .stat { border-top: 1px solid var(--line); padding-top: 8px; }
    .stat dt { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
    .stat dd { margin: 2px 0 0; font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; }
    .path { text-align: center; color: var(--muted); font-size: .8rem; margin: -8px 0 16px; overflow-wrap: anywhere; }
    .path b { color: var(--ink); }
    .note { text-align: center; font-size: .8rem; margin: -10px 0 16px; }
    .note.hidden { display: none; }
    .diet { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 8px; }
    .diet h2 { color: var(--muted); font-size: .75rem; font-weight: 400; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 6px; }
    .dietbar { display: flex; gap: 2px; height: 18px; }
    .dietbar > div { min-width: 4px; border: 2px solid var(--ink); }
    .dietbar > div:first-child { border-radius: 4px 0 0 4px; }
    .dietbar > div:last-child { border-radius: 0 4px 4px 0; }
    .dietbar .empty { flex: 1; border-style: dashed; border-color: var(--line); border-radius: 4px; }
    .k-ap { background: var(--ink); }
    .k-ble { background: repeating-linear-gradient(45deg, var(--ink) 0 2px, transparent 2px 6px); }
    .k-client { background: repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 6px); }
    .k-wearable { background: radial-gradient(var(--ink) 1.2px, transparent 1.6px) 0 0 / 5px 5px; }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; padding: 0; list-style: none; font-size: .8rem; }
    .legend li { display: flex; align-items: center; gap: 6px; }
    .legend i { width: 14px; height: 14px; border: 2px solid var(--ink); border-radius: 3px; display: inline-block; }
    .legend span { color: var(--muted); }
    .foot { color: var(--muted); font-size: .8rem; margin-top: 16px; }
    .error { color: #b3261e; }
  </style>
</head>
<body>
  <main>
    <h1>Ether-Beast</h1>
    <p class="sub">A passive wardriving Tamagotchi. It feeds on Wi-Fi and Bluetooth signals it overhears.</p>

    <section class="card" aria-live="polite">
      <div class="head">
        <div class="level" id="level">Loading&hellip;</div>
        <div>
          <span class="badge hidden" id="ready">Ready to evolve</span>
          <span class="badge hidden" id="sugar">Sugar rush</span>
          <span class="badge hidden" id="starving">Starving</span>
        </div>
      </div>

      <canvas id="monster" width="32" height="32" aria-label="The monster"></canvas>
      <p class="note hidden" id="condition"></p>
      <p class="path" id="path"></p>

      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="barwrap"><div id="bar"></div></div>
      <div class="xp"><span id="xp"></span><span class="combo" id="combo"></span></div>

      <dl class="stats">
        <div class="stat"><dt>Devices eaten</dt><dd id="eaten">&ndash;</dd></div>
        <div class="stat"><dt>Mood</dt><dd id="mood">&ndash;</dd></div>
        <div class="stat"><dt>Last fed</dt><dd id="fed">&ndash;</dd></div>
        <div class="stat"><dt>Last forage</dt><dd id="lastForage">&ndash;</dd></div>
        <div class="stat"><dt>Forage cycles</dt><dd id="cycles">&ndash;</dd></div>
        <div class="stat"><dt>Battery</dt><dd id="battery">&ndash;</dd></div>
        <div class="stat"><dt>Frenzies</dt><dd id="frenzies">&ndash;</dd></div>
        <div class="stat"><dt>Scars</dt><dd id="scars">&ndash;</dd></div>
        <div class="stat"><dt>Regulars (never eaten)</dt><dd id="regulars">&ndash;</dd></div>
      </dl>

      <div class="diet">
        <h2>Diet</h2>
        <div class="dietbar" id="dietbar" role="img" aria-label="Diet"></div>
        <ul class="legend" id="legend"></ul>
      </div>
    </section>

    <p class="foot" id="synced"></p>
  </main>
  <script src="sprites.js"></script>
  <script src="app.js"></script>
</body>
</html>
